name: Atualizar Preços e Limpar Ofertas Indisponíveis

on:
  schedule:
    # Roda a cada 2 horas entre 07:00 e 23:00 (horário de Brasília / UTC-3)
    # Só faz commit e deploy na Vercel quando algum preço ou link realmente mudar!
    - cron: "0 10,12,14,16,18,20,22,0,2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-offers:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auditar preços e remover links indisponíveis
        run: node scripts/sync-offers.mjs

      - name: Salvar e publicar alterações automaticamente
        run: |
          git config user.name "Sidao Dicas Bot"
          git config user.email "bot@sidaodicas.com.br"
          git add src/data/ofertas.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração de preço ou disponibilidade hoje."
          else
            git commit -m "chore: atualizacao diaria automatica de precos e disponibilidade"
            git push
          fi
